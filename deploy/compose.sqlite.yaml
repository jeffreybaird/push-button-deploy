# Runtime stack on the droplet for the SQLITE backend (DATABASE_BACKEND=sqlite).
# Copied to the app repo as deploy/compose.yaml by the bootstrap when the flag is
# set; the Postgres variant lives in compose.yaml. Differences from Postgres:
#
#   * The DB is a SQLite file on a NAMED DOCKER VOLUME (app_data -> /data), not a
#     managed cluster. Both colors + the migrate runner mount it, so the file
#     survives container restarts and blue/green swaps. It does NOT survive
#     droplet destruction by itself — Litestream covers that (below).
#   * No DATABASE_URL / DATABASE_CA_FILE / db-ca.pem: SQLite has no network, no
#     TLS, no server cert. The app reads DATABASE_PATH instead.
#   * A Litestream sidecar streams the SQLite WAL to DO Spaces continuously
#     (litestream service), and a one-shot litestream_restore pulls the latest
#     replica back on boot when /data has no DB yet — so a recreated droplet
#     recovers its data instead of starting empty.
#
# Interpolated values (${...}) come from .env, written over SSH at deploy time:
#   IMAGE            full image ref incl tag, e.g. registry.../app:<sha> (SHA-pinned)
#   DOMAIN           public FQDN (matches the DNSimple A record / cert)
#   DATABASE_PATH    on-volume path to the SQLite file, e.g. /data/app.sqlite3
#   SECRET_KEY_BASE  Phoenix secret
#   LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY   Spaces keypair
#   BACKUP_BUCKET / BACKUP_ENDPOINT / BACKUP_REGION / BACKUP_PATH   replica target
#
# No secrets live in this file — only references. (locked decision 12)

# Shared definition for both colors (and the one-off migrate runner).
x-app: &app
  image: ${IMAGE}
  restart: unless-stopped
  env_file:
    - .env
  environment:
    # Endpoint serves only when this gate is set (runtime.exs).
    PHX_SERVER: "true"
    # URL host for generated links + the Endpoint :url config.
    PHX_HOST: ${DOMAIN}
    PORT: "4000"
    # SQLite file path (Ecto.Adapters.SQLite3 reads DATABASE_PATH in runtime.exs).
    DATABASE_PATH: ${DATABASE_PATH}
  volumes:
    # The SQLite file lives here, shared with the migrate runner + Litestream.
    - app_data:/data
  depends_on:
    # Restore + permission fix must finish before the app opens the DB...
    db_init:
      condition: service_completed_successfully
    # ...and the replicator must be running so writes are streamed off-box.
    litestream:
      condition: service_started
  expose:
    # Internal only — never published to the host. Caddy reaches it by name.
    - "4000"
  networks:
    - web
  healthcheck:
    # Alive = the endpoint answers HTTP at all (any status — apps may redirect /).
    # bash + /dev/tcp because the slim runtime image has no curl/wget.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000 && printf 'HEAD / HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q 'HTTP/' <&3"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

# Shared Litestream config: both the restore and replicate services read the
# same /etc/litestream.yml (env-expanded against .env).
x-litestream: &litestream
  image: litestream/litestream:0.3.14
  env_file:
    - .env
  volumes:
    - app_data:/data
    - ./litestream.yml:/etc/litestream.yml:ro
  networks:
    - web

services:
  # One-shot, runs as root before anything opens the DB. Two jobs:
  #   1. Restore the SQLite file from Spaces IFF /data has no DB yet and a replica
  #      exists (first-ever deploy: both false -> no-op; recreated droplet: empty
  #      volume + existing replica -> full restore).
  #   2. chown /data to the app's runtime uid (Debian 'nobody' = 65534) so the
  #      app, which runs unprivileged, can create the DB + its -wal/-shm files.
  # $$DATABASE_PATH is escaped so the container shell (not compose) expands it.
  db_init:
    <<: *litestream
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - litestream restore -if-db-not-exists -if-replica-exists "$$DATABASE_PATH" && chown -R 65534:65534 /data

  # Long-running: continuously replicate the WAL to Spaces. Runs as root (it can
  # still read the nobody-owned DB and write its own shadow files under /data).
  litestream:
    <<: *litestream
    restart: unless-stopped
    command: ["replicate"]
    depends_on:
      db_init:
        condition: service_completed_successfully

  # Periodic full-database archive to Spaces, under its own prefix.
  #
  # This is NOT redundant with Litestream. The Litestream replica is a
  # continuously-updated MIRROR with a short retention window (24h by default):
  # it answers "the droplet died five minutes ago", and it cannot answer
  # "restore last Tuesday" — the older WAL and snapshots have been pruned. On
  # the Postgres backend the managed cluster's own backups covered that; on
  # SQLite nothing does unless something like this runs.
  #
  # ARCHIVE_INTERVAL_SECONDS (optional, in .env) overrides the daily default.
  backup:
    image: alpine:3.22
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Read-write on purpose: opening a WAL-mode database needs to touch its
      # -shm file even to read. VACUUM INTO only writes to the destination.
      - app_data:/data
    depends_on:
      db_init:
        condition: service_completed_successfully
    networks:
      - web
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes are for the CONTAINER shell — compose must not expand these.
    command:
      - |
        apk add --no-cache sqlite curl >/dev/null || exit 1
        name=$$(basename "$$DATABASE_PATH" .sqlite3)
        echo "backup: archiving $$name every $${ARCHIVE_INTERVAL_SECONDS:-86400}s"
        while :; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          month=$$(date -u +%Y-%m)
          tmp=/tmp/$$name.sqlite3
          rm -f "$$tmp" "$$tmp.gz"
          # VACUUM INTO takes a consistent, compacted copy of a LIVE database.
          # Copying the file directly would race with writers and could capture
          # a torn page plus a stale -wal.
          if ! sqlite3 "$$DATABASE_PATH" "VACUUM INTO '$$tmp'"; then
            echo "backup: FAILED (VACUUM INTO)" >&2
          elif ! gzip -f "$$tmp"; then
            echo "backup: FAILED (gzip)" >&2
          elif ! curl -fsS --max-time 300 -X PUT \
                 --aws-sigv4 "aws:amz:$$BACKUP_REGION:s3" \
                 --user "$$LITESTREAM_ACCESS_KEY_ID:$$LITESTREAM_SECRET_ACCESS_KEY" \
                 -T "$$tmp.gz" \
                 "$$BACKUP_ENDPOINT/$$BACKUP_BUCKET/archive/$$name/$$month/$$name-$$ts.sqlite3.gz"; then
            echo "backup: FAILED (upload)" >&2
          else
            echo "backup: archive/$$name/$$month/$$name-$$ts.sqlite3.gz ($$(stat -c%s "$$tmp.gz") bytes)"
          fi
          rm -f "$$tmp" "$$tmp.gz"
          # Failures fall through to the sleep rather than exiting: a crash-loop
          # would just hammer Spaces, and the next cycle may well succeed.
          sleep "$${ARCHIVE_INTERVAL_SECONDS:-86400}"
        done

  app_blue: *app
  app_green: *app

  # One-off migration runner (profile keeps it out of `up -d`):
  #   docker compose run --rm migrate bin/<app> eval '<Module>.Release.migrate()'
  migrate:
    <<: *app
    restart: "no"
    profiles: ["tools"]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certs + ACME account across restarts/redeploys.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  app_data:
  caddy_data:
  caddy_config:

networks:
  web:
