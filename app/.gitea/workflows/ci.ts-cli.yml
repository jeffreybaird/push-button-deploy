# CI for a droplet-free TYPESCRIPT CLI (FRAMEWORK=ts-cli). Copied into the
# project repo by the bootstrap as .gitea/workflows/ci.yml.
# `bootstrap.sh --cli typescript` builds this.
#
# The GIT_PROVIDER=gitea counterpart of ../.github/workflows/ci.ts-cli.yml.
# Same pipeline against the `gitea.` context; this one touches no droplet and
# needs no DigitalOcean credential, so there is no firewall hole-punch to drop.
#
# Two jobs: test (the gate) -> package (the artifact). There is no deploy job
# because a CLI has nowhere to be deployed to — no droplet, no DNS, no image,
# no database. What it has instead is an npm package that puts a command on
# someone's PATH, so this pipeline's job is to build one and prove it runs.
#
# The Node version comes from .node-version in the repo, which setup-node reads
# directly — bumping Node is a commit to the project, never an edit to this file.
#
# `npm install` rather than `npm ci`, and no dependency cache: the scaffold
# ships no package-lock.json, and there is exactly one devDependency to fetch.
# Once you commit a lockfile, switch both jobs to `npm ci` and add
# `cache: npm` to setup-node.
#
# Required repo config: none. That is the point.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Re-run against main without pushing a commit — the bootstrap uses this when
  # a re-run finds nothing to commit and so fires no push event.
  workflow_dispatch:

# A superseded run tells you nothing a newer one won't: cancel, don't queue.
concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  # Red tests block the package entirely: package needs this job.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Typecheck first: it is the fastest check and the one most likely to
      # fail, so a red run says why in seconds rather than after a full build.
      - name: Typecheck
        run: npm run typecheck

      # `npm test` builds, then runs node:test against the COMPILED output —
      # so what the tests exercise is what the package ships.
      - name: Run tests
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # .app-name is written by the scaffold and names both the package and the
      # command, so it is the one place this workflow has to look.
      - name: Read the command's name
        id: meta
        run: |
          app=$(tr -d '[:space:]' < .app-name)
          if [ -z "$app" ]; then
            echo "::error::.app-name is empty — cannot tell what the command is called"; exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Build the package
        id: build
        run: |
          npm install --no-audit --no-fund
          npm run build
          tarball=$(npm pack --silent)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # Prove the thing runs the way a user will get it — installed globally,
      # from the PATH, not from the checkout. A package that builds but whose
      # bin entry is wrong is exactly the failure worth catching here.
      - name: Smoke-test the installed command
        run: |
          npm install -g "./${{ steps.build.outputs.tarball }}"
          "${{ steps.meta.outputs.app }}" --version
          "${{ steps.meta.outputs.app }}" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.app }}-npm-package
          path: ${{ steps.build.outputs.tarball }}
          if-no-files-found: error

      # NO RELEASE UPLOAD ON THIS PATH, deliberately. Gitea's runners ship no
      # `gh`, and attaching a file to a release means calling Gitea's own API
      # with a token that carries release-write scope — which the automatic
      # per-run token is not guaranteed to have. Rather than emit a step that
      # fails on half the instances it lands on, the tag push builds and keeps
      # the artifact like any other run, and publishing a release stays manual.
      # Porting it is the same gap the staging workflow has (see the README's
      # Gitea section).
