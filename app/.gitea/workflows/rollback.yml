# Manual rollback: pin a previously-built image tag and restart — no rebuild.
# Copied into the app repo by the bootstrap (story 7.1).
#
# This is the GIT_PROVIDER=gitea counterpart of ../.github/workflows/rollback.yml
# — same pipeline, minus the per-run SSH firewall hole-punch (see deploy.yml's
# header comment: the self-hosted runner's IP is allow-listed once, statically,
# in infra-app/firewall.tf instead).
#
# Trigger: from the Gitea web UI (Actions tab -> rollback -> Run workflow), or
#          POST $GITEA_URL/api/v1/repos/<owner>/<repo>/actions/workflows/rollback.yml/dispatches
#          with {"ref":"main","inputs":{"tag":"<prior commit sha>"}}
#          (any tag already in the registry works; deploys push :<sha> + :latest)
#
# What it does NOT do: roll back database migrations. The schema stays at
# whatever the newest deploy migrated to; the older code must tolerate it
# (additive migrations make this safe). For a schema rollback, run
# <Module>.Release.rollback/2 by hand — deliberately not automated.
#
# Shares the deploy workflow's concurrency group, so a rollback can never
# overlap an in-flight push deploy (and vice versa).
name: rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to pin (a prior commit SHA)"
        required: true
        type: string

concurrency:
  group: deploy-${{ gitea.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.DROPLET_HOST }}
      TAG: ${{ inputs.tag }}
      # Same slug the deploy workflow uses — it locates this app's stack among
      # any others on the droplet.
      APP_SLUG: ${{ vars.APP_SLUG }}
      STACK_DIR: /root/apps/${{ vars.APP_SLUG }}
    steps:
      - uses: actions/checkout@v6

      # Same app-name parse as deploy.yml — the registry repository is named
      # after the OTP app, never hardcoded.
      - name: Parse app name from mix.exs
        id: meta
        run: |
          app_name=$(grep -Eo 'app:[[:space:]]*:[a-z][a-z0-9_]*' mix.exs | head -1 | sed -E 's/.*:([a-z0-9_]+)$/\1/')
          if [ -z "$app_name" ]; then echo "::error::could not parse app name from mix.exs"; exit 1; fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${{ vars.DOCR_REGISTRY }}/${app_name}" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Fail here — before touching the droplet — if the requested tag was
      # never built. Typos can't take the site down.
      - name: Verify tag exists in registry
        run: |
          if ! doctl registry repository list-tags "${{ steps.meta.outputs.app_name }}" \
               --format Tag --no-header | grep -qx "$TAG"; then
            echo "::error::tag '$TAG' not found in registry repository '${{ steps.meta.outputs.app_name }}'"
            echo "Available tags:"
            doctl registry repository list-tags "${{ steps.meta.outputs.app_name }}" --format Tag,UpdatedAt
            exit 1
          fi

      # No firewall hole-punch here (see file header) — the runner's IP is
      # already allow-listed for SSH, statically, in infra-app/firewall.tf.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Identical .env contract to deploy.yml, IMAGE pinned to the chosen tag.
      # DB-specific lines branch on vars.DATABASE_BACKEND (empty = postgres).
      - name: Write .env (Postgres, pinned image)
        if: ${{ vars.DATABASE_BACKEND != 'sqlite' }}
        run: |
          umask 077
          cat > .env <<EOF
          IMAGE=${{ steps.meta.outputs.image }}:${TAG}
          DOMAIN=${{ vars.DOMAIN }}
          APP_SLUG=${APP_SLUG}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}
          EOF
          # App-specific runtime variables (e.g. ACCESS_PASSWORD, RETENTION_DAYS_*):
          # the APP_ENV secret holds KEY=VALUE lines and is appended verbatim.
          # Unset means nothing is appended.
          printf '%s\n' "${{ secrets.APP_ENV }}" >> .env

      - name: Write .env (SQLite, pinned image)
        if: ${{ vars.DATABASE_BACKEND == 'sqlite' }}
        run: |
          umask 077
          cat > .env <<EOF
          IMAGE=${{ steps.meta.outputs.image }}:${TAG}
          DOMAIN=${{ vars.DOMAIN }}
          APP_SLUG=${APP_SLUG}
          SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}
          DATABASE_PATH=${{ vars.DATABASE_PATH }}
          LITESTREAM_ACCESS_KEY_ID=${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY=${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          BACKUP_BUCKET=${{ vars.BACKUP_BUCKET }}
          BACKUP_ENDPOINT=${{ vars.BACKUP_ENDPOINT }}
          BACKUP_REGION=${{ vars.BACKUP_REGION }}
          BACKUP_PATH=${{ vars.BACKUP_PATH }}
          EOF
          # App-specific runtime variables (e.g. ACCESS_PASSWORD, RETENTION_DAYS_*):
          # the APP_ENV secret holds KEY=VALUE lines and is appended verbatim.
          # Unset means nothing is appended.
          printf '%s\n' "${{ secrets.APP_ENV }}" >> .env

      - name: Write db-ca.pem
        if: ${{ vars.DATABASE_BACKEND != 'sqlite' }}
        run: |
          printf '%s\n' "${{ secrets.DATABASE_CA_CERT }}" > db-ca.pem
          chmod 644 db-ca.pem

      # The shared edge proxy is host-owned and already running; refreshing it
      # here keeps a rollback self-sufficient (it can bring a droplet back on its
      # own) and re-asserts this app's route.
      - name: Create stack directories
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$HOST" \
            "mkdir -p /root/caddy/sites '$STACK_DIR'"

      - name: Copy shared edge files to droplet
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/edge-compose.yaml \
            root@"$HOST":/root/caddy/compose.yaml
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/Caddyfile deploy/site.caddy.tmpl deploy/edge.sh \
            root@"$HOST":/root/caddy/

      - name: Copy stack files + .env to droplet (Postgres)
        if: ${{ vars.DATABASE_BACKEND != 'sqlite' }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/compose.yaml deploy/swap.sh db-ca.pem .env \
            root@"$HOST":"$STACK_DIR"/

      - name: Copy stack files + .env to droplet (SQLite)
        if: ${{ vars.DATABASE_BACKEND == 'sqlite' }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/compose.yaml deploy/swap.sh deploy/litestream.yml .env \
            root@"$HOST":"$STACK_DIR"/

      - name: Prepare shared edge (network, Caddy, route)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$HOST" \
            "APP_SLUG='$APP_SLUG' DOMAIN='${{ vars.DOMAIN }}' bash /root/caddy/edge.sh"

      # No migration step: the pinned image is older than (or equal to) the
      # schema, so Ecto.Migrator would find nothing pending anyway.
      # Same health-checked blue/green swap as deploy — a rollback to a broken
      # image fails the swap and leaves the current color serving.
      - name: Pull pinned image and swap
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$HOST" \
            "echo '${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}' | docker login registry.digitalocean.com -u '${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}' --password-stdin \
             && cd '$STACK_DIR' && docker compose pull && bash swap.sh"
