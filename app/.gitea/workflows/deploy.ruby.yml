# Push-to-main deploy pipeline for a SINATRA app (FRAMEWORK=sinatra).
# Copied into the app repo as .gitea/workflows/deploy.yml by the bootstrap.
# Jobs: test (gate) -> build+push -> deliver/migrate/swap.
#
# This is the GIT_PROVIDER=gitea counterpart of
# ../.github/workflows/deploy.ruby.yml — same pipeline, minus the per-run SSH
# firewall hole-punch (see deploy.yml's header comment in this directory: the
# self-hosted runner's IP is allow-listed once, statically, in
# infra-app/firewall.tf instead).
#
# The Sinatra path is SQLite-only, so this workflow has no Postgres branch: the
# .env it writes over SSH always carries the Litestream/Spaces replica config.
#
# Required repo config (seeded by bootstrap):
#   secret DIGITALOCEAN_ACCESS_TOKEN  - DO API token (registry push)
#   var    DOCR_REGISTRY              - DO Container Registry name
#   var    APP_SLUG                   - this app's slug on the droplet; keeps the
#                                       stack dir, compose project, Caddy site
#                                       file and network aliases from colliding
#                                       with any other app on the same host
name: deploy

on:
  push:
    branches: [main]
  # Redeploy whatever is on main without pushing a commit. Repo variables
  # (DOMAIN, APP_SLUG, DROPLET_HOST) are not reflected in git, so changing one
  # otherwise has no way to reach the droplet: a bootstrap re-run that finds
  # nothing to commit triggers no deploy, and the old value keeps serving.
  workflow_dispatch:

# One deploy at a time; never overlap. Queue rather than cancel so an in-flight
# deploy (migrations!) is never interrupted.
concurrency:
  group: deploy-${{ gitea.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com

jobs:
  # Red tests block the deploy entirely: build needs this job.
  test:
    runs-on: ubuntu-latest
    env:
      RACK_ENV: test
    steps:
      - uses: actions/checkout@v6

      # Ruby version comes from .ruby-version (single source of truth, same file
      # the Dockerfile's RUBY_VERSION is kept in sync with).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      # spec_helper migrates a fresh SQLite test DB before the suite runs, so no
      # service container is needed. Red tests fail the job -> block the deploy.
      - name: Run tests
        run: bundle exec rspec

  build:
    needs: test
    runs-on: ubuntu-latest # native amd64
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      # App-name-agnostic: the registry repository is named after the app, read
      # from the committed .app-name marker (a Rack app has no mix.exs to parse).
      - name: Read app name
        id: meta
        run: |
          app_name=$(tr -d '[:space:]' < .app-name)
          if [ -z "$app_name" ]; then echo "::error::.app-name is empty or missing"; exit 1; fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${{ vars.DOCR_REGISTRY }}/${app_name}" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ gitea.sha }}
            ${{ steps.meta.outputs.image }}:latest
          # No `cache-from/cache-to: type=gha` here, unlike the GitHub
          # workflows. That backend talks to the Actions Cache service, which
          # act_runner deliberately does not run in this topology (see
          # gitea-host/act_runner-config.yaml for why). buildx does not degrade
          # gracefully when it is missing the way `actions/cache` does -- it
          # fails the whole build on the 404, and because the 404 body is not
          # JSON the error is the unhelpful "failed to parse error response
          # 404: Not found. : invalid character 'N'" (confirmed live).
          #
          # The build therefore starts cold every run. If that gets slow, the
          # fix is a registry-backed cache (`cache-to: type=registry,ref=
          # <image>:buildcache,mode=max`), which needs no cache service -- at
          # the cost of extra storage in your container registry.

  # Deliver the new image to the droplet and restart the stack.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build.outputs.image }}:${{ gitea.sha }}
      HOST: ${{ vars.DROPLET_HOST }}
      # One droplet can host several apps. Everything that must not collide with
      # a neighbour is keyed on this slug: the stack directory, the compose
      # project (hence container + volume names), the Caddy site file, and the
      # per-color network aliases Caddy dials.
      APP_SLUG: ${{ vars.APP_SLUG }}
      STACK_DIR: /root/apps/${{ vars.APP_SLUG }}
    steps:
      - uses: actions/checkout@v6

      # No firewall hole-punch here (see file header) — the runner's IP is
      # already allow-listed for SSH, statically, in infra-app/firewall.tf.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # .env carries the SHA-pinned image + runtime secrets/config. Built on the
      # runner, shipped to the droplet, never committed. (locked decision:
      # secrets arrive over SSH at deploy time, never in cloud-init/metadata.)
      - name: Write .env
        run: |
          umask 077
          cat > .env <<EOF
          IMAGE=${IMAGE}
          DOMAIN=${{ vars.DOMAIN }}
          APP_SLUG=${APP_SLUG}
          SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}
          DATABASE_PATH=${{ vars.DATABASE_PATH }}
          LITESTREAM_ACCESS_KEY_ID=${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY=${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          BACKUP_BUCKET=${{ vars.BACKUP_BUCKET }}
          BACKUP_ENDPOINT=${{ vars.BACKUP_ENDPOINT }}
          BACKUP_REGION=${{ vars.BACKUP_REGION }}
          BACKUP_PATH=${{ vars.BACKUP_PATH }}
          EOF
          # App-specific runtime variables (e.g. ACCESS_PASSWORD, RETENTION_DAYS_*):
          # the APP_ENV secret holds KEY=VALUE lines and is appended verbatim.
          # Unset means nothing is appended.
          printf '%s\n' "${{ secrets.APP_ENV }}" >> .env

      # Two destinations, because two things live on the droplet with different
      # owners: /root/caddy is the SHARED edge proxy (one per host, every app
      # contributes a site file to it) and /root/apps/<slug> is this app's stack.
      - name: Create stack directories
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$HOST" \
            "mkdir -p /root/caddy/sites '$STACK_DIR'"

      - name: Copy shared edge files to droplet
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/edge-compose.yaml \
            root@"$HOST":/root/caddy/compose.yaml
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/Caddyfile deploy/site.caddy.tmpl deploy/edge.sh \
            root@"$HOST":/root/caddy/

      - name: Copy stack files + .env to droplet
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/compose.yaml deploy/swap.sh deploy/litestream.yml .env \
            root@"$HOST":"$STACK_DIR"/

      # Shared network + shared Caddy + this app's route, before the app starts.
      # On a droplet still running the old single-stack layout this also performs
      # the one-time migration into /root/apps (see deploy/edge.sh).
      - name: Prepare shared edge (network, Caddy, route)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$HOST" \
            "APP_SLUG='$APP_SLUG' DOMAIN='${{ vars.DOMAIN }}' bash /root/caddy/edge.sh"

      - name: Registry login + pull new image
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$HOST" \
            "echo '${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}' | docker login registry.digitalocean.com -u '${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}' --password-stdin \
             && cd '$STACK_DIR' && docker compose pull"

      # Migration gate: runs the new image as a one-off BEFORE serving traffic.
      # A non-zero exit fails this step -> the job fails -> the swap is skipped
      # -> the previously-running color keeps serving. A bad migration can never
      # serve a half-updated DB.
      - name: Run migrations (gate before traffic)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$HOST" \
            "cd '$STACK_DIR' && docker compose run --rm migrate bundle exec rake db:migrate"

      # Health-checked blue/green swap: start the idle color from the new image,
      # wait for its healthcheck, only then stop the old color. Caddy holds
      # requests through the window — no downtime.
      - name: Swap to new release
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$HOST" \
            "bash '$STACK_DIR'/swap.sh"
