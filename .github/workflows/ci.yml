name: ci

# This tool demands a lint-and-test pipeline of every app it scaffolds
# (app/.github/workflows/, scripts/new-*-cli.sh). It should hold itself to the
# same standard, and now that it is a command with a test suite it can.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # -x so it follows `. lib/pbd/common.sh` and the scripts/ helpers into
        # the same pass, which is the point of the source= directives.
        run: |
          shellcheck --version
          shellcheck -x -S warning bin/pbd lib/pbd/common.sh test/run.sh \
            bootstrap.sh teardown.sh bootstrap-gitea.sh teardown-gitea.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the CLI contract
        run: ./test/run.sh

  # The formula has to keep installing. `brew style` catches the syntax and
  # idiom problems that would otherwise surface at tap time.
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew style Formula/pbd.rb
